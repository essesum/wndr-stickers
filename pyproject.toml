[project]
name = "wndr-stickers"
version = "0.4.0"
description = "WNDR community sticker bot: Hermes skill + standalone Telegram bot"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Катя", email = "ekaterinasumm@gmail.com"}]
dependencies = [
    "aiogram>=3.4.0",
    "aiosqlite>=0.20.0",
    "httpx[socks]>=0.27.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["skill*", "bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
